services:
  agentlog:
    image: agentlog:local
    build:
      context: .
    environment:
      AGENTLOG_TOKEN: ${AGENTLOG_TOKEN:-}
      SQLITE_TMPDIR: /data
    command: ["--listen", "0.0.0.0:4318", "--db", "/data/agentlog.db"]
    ports:
      - "127.0.0.1:${AGENTLOG_PORT:-4318}:4318"
    volumes:
      - agentlog-data:/data
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  agentlog-data:

services:
  caddy:
    image: caddy:2-alpine
    environment:
      # Keep the Docker upstream local when the host configures an outbound proxy.
      NO_PROXY: agentlog,localhost,127.0.0.1,::1
      AGENTLOG_DOMAIN: ${AGENTLOG_DOMAIN:?Set AGENTLOG_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - agentlog
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy-data:
  caddy-config:

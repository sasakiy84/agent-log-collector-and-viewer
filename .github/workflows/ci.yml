name: CI
on:
  push:
    branches: [main, work]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: bash scripts/check-static.sh
      - run: go test -race ./...
      - run: go vet ./...
      - run: python3 -m unittest discover -s scripts -p '*_unit_test.py'
      - run: go build ./cmd/agentlog
      - name: Verify published database upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/test-upgrade.sh
      - run: python3 scripts/watch_test.py
      - run: python3 scripts/search_memory_test.py
      - run: python3 scripts/usage_performance_test.py
      - run: scripts/release.sh ci
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Compose image
        env:
          AGENTLOG_TOKEN: ci-build-placeholder-at-least-16
        run: docker compose build
      - run: python3 scripts/docker_smoke.py
  verified:
    needs: [test, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ci_verification.py record
      - uses: actions/upload-artifact@v4
        with:
          name: ci-verification-${{ github.run_attempt }}
          path: ci-verification.json
          retention-days: 30
          if-no-files-found: error

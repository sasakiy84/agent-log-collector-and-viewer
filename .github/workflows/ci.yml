name: CI
on:
  push:
    branches: [main, work]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go test -race ./...
      - run: go vet ./...
      - run: node --check internal/app/static/app.js
      - run: node --check internal/app/static/pagination.js
      - run: node --check internal/app/static/usage.js
      - run: node --check internal/app/static/subagents.js
      - run: node --check internal/app/static/tool_pairs.js
      - run: node --check internal/app/static/skills.js
      - run: go build ./cmd/agentlog
      - run: python3 scripts/watch_test.py
      - run: python3 scripts/search_memory_test.py
      - run: python3 scripts/usage_performance_test.py
      - run: scripts/release.sh ci
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Compose image
        env:
          AGENTLOG_TOKEN: ci-build-placeholder-at-least-16
        run: docker compose build
      - run: python3 scripts/docker_smoke.py

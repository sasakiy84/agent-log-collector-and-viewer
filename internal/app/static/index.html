<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agentlog</title><link rel="stylesheet" href="/palette.css"><link rel="stylesheet" href="/style.css"><script src="/pagination.js" defer></script><script src="/usage.js" defer></script><script src="/subagents.js" defer></script><script src="/tool_pairs.js" defer></script><script src="/skills.js" defer></script><script src="/projects.js" defer></script><script src="/model_calls.js" defer></script><script src="/app.js" defer></script></head><body>
<section id="login" hidden><form id="loginform"><h1>Agentlog</h1><label>Access token<input id="token" type="password" required autocomplete="current-password"></label><button class="primary">Sign in</button><p id="loginerror" role="alert"></p></form></section>
<div id="workspace" hidden><header class="topbar"><a href="/" class="brand">Agentlog</a><a id="skillsnav" href="/skills">Skills</a><a href="/archive" class="archive-nav">Archive</a><button id="refresh">Refresh</button><button id="logout">Sign out</button></header><div id="error" role="alert"></div>
<main id="listpage"><aside id="projectsidebar" aria-label="Projects"><h2>Projects</h2><input id="projectsearch" type="search" placeholder="Find a project" aria-label="Find a project" maxlength="256"><button id="allprojects" class="project-choice">All projects</button><nav id="projectlist" aria-label="Project selection"></nav><p id="projectstatus" class="muted" role="status"></p><button id="moreprojects" hidden>Load more projects</button></aside><section class="session-results" aria-label="Sessions"><a id="foldersback" href="/" class="back" hidden>Folders</a><div class="pageheading"><h1 id="listtitle">Sessions</h1><span id="listcount" class="muted"></span></div><div class="toolbar"><nav aria-label="Agent"><button data-source="" class="active">All</button><button data-source="codex">Codex</button><button data-source="claude">Claude Code</button><button data-source="copilot">Copilot</button><button data-source="other">Other</button></nav><label class="diagnostics-toggle"><input id="showdiagnostics" type="checkbox" title="Include Codex logs and traces without a conversation ID">Unassigned Codex events</label><input id="search" type="search" placeholder="Search sessions" aria-label="Search sessions" maxlength="512" title="Japanese and English full-text search. Separate words with spaces; the final word also matches prefixes."></div><div id="skillfilter" hidden><span id="skillfilterlabel"></span><button id="clearskillfilter">Clear skill filter</button></div><p id="folderpath" class="folderpath" hidden></p><div class="tablehead"><span id="listcolumn">Session</span><span>Agent</span><span>Last activity</span><span>Reported usage</span><span id="countcolumn">Events</span></div><div id="sessions"></div><nav id="sessionpagination" class="pagination" aria-label="Session pages" tabindex="-1"></nav></section></main>
<main id="skillpage" hidden><section class="skill-results" aria-label="Skill usage"><div class="pageheading"><h1 id="skilltitle">Skills</h1><span id="skillcount" class="muted" title="Reported invocations; read references are counted separately"></span></div><div class="toolbar"><span id="skillindexstatus" class="muted" role="status"></span><label class="skill-sort">Sort<select id="skillsort" aria-label="Sort skills"><option value="uses">Most used</option><option value="sessions">Most sessions</option><option value="recent">Recent activity</option></select></label><input id="skillsearch" type="search" placeholder="Search skills" aria-label="Search skills" maxlength="512"></div><div class="skill-tablehead"><span>Skill</span><span title="Reported Codex invocations, deduplicated by turn">Uses</span><span>Sessions</span><span title="Sessions with a SKILL.md read reference or skill injection; not an invocation count">Referenced sessions</span><span>Last activity</span></div><div id="skillrows"></div><nav id="skillpagination" class="pagination" aria-label="Skill pages" tabindex="-1"></nav></section></main><main id="archivepage" hidden><a href="/" class="back">Sessions</a><div class="pageheading"><h1>Archive inactive sessions</h1><span id="archivetotal" class="muted"></span></div><p id="archivecutoff" class="muted"></p><section id="archivejob" aria-live="polite"></section><div id="archiveselection" class="toolbar"><button id="archiveall">Select all inactive sessions</button><button id="archiveclear">Clear</button><span id="archiveselected" class="muted"></span><button id="archivecreate" class="primary" disabled>Create ZIP</button></div><div id="archiveitems"></div><nav id="archivepagination" class="pagination" aria-label="Archive pages" tabindex="-1"></nav></main>
<main id="detailpage" hidden><a href="/" class="back">Sessions</a><div class="pageheading"><h1 id="sessiontitle">Session</h1><a id="export" class="button">Export JSON</a></div><div id="sessionmeta" class="metadata"></div><section id="sessionusage" aria-label="Session usage" tabindex="-1"></section><div id="sessionskills"></div><div id="relations"></div><div class="logbar"><nav aria-label="Telemetry view" class="view-switch"><button data-view="activity" class="active">Activity</button><button data-view="diagnostics">Diagnostics</button></nav><nav aria-label="Event type"><button data-kind="" class="active">All</button><button data-kind="conversation">Conversation</button><button data-kind="tool">Tools</button><button data-kind="error">Errors</button><button data-kind="metric">Metrics</button><button data-kind="skill">Skills</button></nav><select id="origin" aria-label="Event origin"><option value="">All sources</option><option value="otel">OTEL</option><option value="import">Imported</option></select></div><p id="pageinfo" class="muted"></p><div class="eventlayout"><section id="eventlist" aria-label="Session events"><div id="timeline"></div><nav id="eventpagination" class="pagination" aria-label="Event pages" tabindex="-1"></nav></section><aside id="inspector" aria-labelledby="inspectortitle" tabindex="-1" hidden><div class="inspectorheader"><div class="inspectorheading"><div><span id="inspectortime" class="muted"></span><h2 id="inspectortitle">Event details</h2></div><button id="closeinspector" aria-label="Close event details">Close</button></div><p id="inspectstatus" role="status"></p><div id="subagentactions" hidden><button id="subagentback">Event details</button><a id="subagentfull" class="button">Open session</a><button id="subagentrefresh">Refresh</button></div><nav class="inspectortabs" aria-label="Event details" role="tablist"><button id="detailtab" role="tab" aria-selected="true" aria-controls="inspectdetails" tabindex="0">Details</button><button id="jsontab" role="tab" aria-selected="false" aria-controls="inspectjson" tabindex="-1">JSON</button></nav></div><div class="inspectorbody"><section id="inspectagent" aria-label="Subagent logs" hidden><div id="subagentevents"></div><nav id="subagentpagination" class="pagination" aria-label="Subagent event pages" tabindex="-1"></nav></section><section id="inspectdetails" role="tabpanel" aria-labelledby="detailtab"></section><section id="inspectjson" role="tabpanel" aria-labelledby="jsontab" hidden><div class="jsonactions"><button id="copyjson">Copy JSON</button><span id="copystatus" role="status"></span></div><pre id="eventjson" tabindex="0"></pre></section></div></aside></div></main></div></body></html>

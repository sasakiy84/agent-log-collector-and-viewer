<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agentlog</title><link rel="stylesheet" href="/style.css"><script src="/parse.js" defer></script><script src="/app.js" defer></script></head><body>
<section id="login" hidden><form id="loginform"><h1>Agentlog</h1><label>Access token<input id="token" type="password" required autocomplete="current-password"></label><button class="primary">Sign in</button><p id="loginerror" role="alert"></p></form></section>
<div id="workspace" hidden><header class="topbar"><a href="/" class="brand">Agentlog</a><span class="connection" id="connection">Auto-refresh · 5s</span><button id="logout">Sign out</button></header><div id="error" role="alert"></div>
<main id="listpage"><div class="pageheading"><h1>Sessions</h1><span id="listcount" class="muted"></span></div><div class="toolbar"><nav aria-label="Agent"><button data-source="" class="active">All</button><button data-source="codex">Codex</button><button data-source="claude">Claude Code</button><button data-source="copilot">Copilot</button><button data-source="other">Other</button></nav><input id="search" type="search" placeholder="Search sessions" aria-label="Search sessions"></div><div class="tablehead"><span>Session</span><span>Agent</span><span>Last activity</span><span>Events</span></div><div id="sessions"></div><div class="pager"><button id="prevsessions">Previous</button><button id="nextsessions">Next</button></div></main>
<main id="detailpage" hidden><a href="/" class="back">Sessions</a><div class="pageheading"><h1 id="sessiontitle">Session</h1><a id="export" class="button">Export JSON</a></div><div id="sessionmeta" class="metadata"></div><div id="relations"></div><div class="logbar"><nav aria-label="Event type"><button data-kind="" class="active">All</button><button data-kind="conversation">Conversation</button><button data-kind="tool">Tools</button><button data-kind="error">Errors</button><button data-kind="metric">Metrics</button></nav><select id="origin" aria-label="Event origin"><option value="">All sources</option><option value="otel">OTEL</option><option value="import">Imported</option></select><label><input id="autorefresh" type="checkbox" checked> Auto-refresh</label></div><p id="pageinfo" class="muted"></p><div class="eventlayout"><section id="eventlist" aria-label="Session events"><div id="timeline"></div><div class="pager"><button id="prevevents">Previous</button><button id="nextevents">Next</button></div></section><aside id="inspector" aria-labelledby="inspectortitle" tabindex="-1" hidden><div class="inspectorheading"><div><span id="inspectortime" class="muted"></span><h2 id="inspectortitle">Event details</h2></div><button id="closeinspector" aria-label="Close event details">Close</button></div><nav class="inspectortabs" aria-label="Event details" role="tablist"><button id="detailtab" role="tab" aria-selected="true" aria-controls="inspectdetails" tabindex="0">Details</button><button id="jsontab" role="tab" aria-selected="false" aria-controls="inspectjson" tabindex="-1">JSON</button></nav><section id="inspectdetails" role="tabpanel" aria-labelledby="detailtab"></section><section id="inspectjson" role="tabpanel" aria-labelledby="jsontab" hidden><div class="jsonactions"><button id="copyjson">Copy JSON</button><span id="copystatus" role="status"></span></div><pre id="eventjson" tabindex="0"></pre></section></aside></div></main></div></body></html>

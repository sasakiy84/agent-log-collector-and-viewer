<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agentlog</title><link rel="stylesheet" href="/style.css"><script src="/pagination.js" defer></script><script src="/usage.js" defer></script><script src="/app.js" defer></script></head><body>
<section id="login" hidden><form id="loginform"><h1>Agentlog</h1><label>Access token<input id="token" type="password" required autocomplete="current-password"></label><button class="primary">Sign in</button><p id="loginerror" role="alert"></p></form></section>
<div id="workspace" hidden><header class="topbar"><a href="/" class="brand">Agentlog</a><a href="/archive" class="archive-nav">Archive</a><button id="refresh">Refresh</button><button id="logout">Sign out</button></header><div id="error" role="alert"></div>
<main id="listpage"><a id="foldersback" href="/" class="back" hidden>Folders</a><div class="pageheading"><h1 id="listtitle">Folders</h1><span id="listcount" class="muted"></span></div><div class="toolbar"><nav aria-label="Agent"><button data-source="" class="active">All</button><button data-source="codex">Codex</button><button data-source="claude">Claude Code</button><button data-source="copilot">Copilot</button><button data-source="other">Other</button></nav><input id="search" type="search" placeholder="Search sessions" aria-label="Search sessions" maxlength="512" title="Japanese and English full-text search. Separate words with spaces; the final word also matches prefixes."></div><p id="folderpath" class="folderpath" hidden></p><div class="tablehead"><span id="listcolumn">Folder</span><span>Agent</span><span>Last activity</span><span>Reported usage</span><span id="countcolumn">Sessions</span></div><div id="sessions"></div><nav id="sessionpagination" class="pagination" aria-label="Session pages" tabindex="-1"></nav></main>
<main id="archivepage" hidden><a href="/" class="back">Folders</a><div class="pageheading"><h1>Archive inactive sessions</h1><span id="archivetotal" class="muted"></span></div><p id="archivecutoff" class="muted"></p><section id="archivejob" aria-live="polite"></section><div id="archiveselection" class="toolbar"><button id="archiveall">Select all inactive sessions</button><button id="archiveclear">Clear</button><span id="archiveselected" class="muted"></span><button id="archivecreate" class="primary" disabled>Create ZIP</button></div><div id="archiveitems"></div><nav id="archivepagination" class="pagination" aria-label="Archive pages" tabindex="-1"></nav></main>
<main id="detailpage" hidden><a href="/" class="back">Sessions</a><div class="pageheading"><h1 id="sessiontitle">Session</h1><a id="export" class="button">Export JSON</a></div><div id="sessionmeta" class="metadata"></div><section id="sessionusage" aria-label="Session usage" tabindex="-1"></section><div id="relations"></div><div class="logbar"><nav aria-label="Event type"><button data-kind="" class="active">All</button><button data-kind="conversation">Conversation</button><button data-kind="tool">Tools</button><button data-kind="error">Errors</button><button data-kind="metric">Metrics</button></nav><select id="origin" aria-label="Event origin"><option value="">All sources</option><option value="otel">OTEL</option><option value="import">Imported</option></select></div><p id="pageinfo" class="muted"></p><div class="eventlayout"><section id="eventlist" aria-label="Session events"><div id="timeline"></div><nav id="eventpagination" class="pagination" aria-label="Event pages" tabindex="-1"></nav></section><aside id="inspector" aria-labelledby="inspectortitle" tabindex="-1" hidden><div class="inspectorheader"><div class="inspectorheading"><div><span id="inspectortime" class="muted"></span><h2 id="inspectortitle">Event details</h2></div><button id="closeinspector" aria-label="Close event details">Close</button></div><p id="inspectstatus" role="status"></p><nav class="inspectortabs" aria-label="Event details" role="tablist"><button id="detailtab" role="tab" aria-selected="true" aria-controls="inspectdetails" tabindex="0">Details</button><button id="jsontab" role="tab" aria-selected="false" aria-controls="inspectjson" tabindex="-1">JSON</button></nav></div><div class="inspectorbody"><section id="inspectdetails" role="tabpanel" aria-labelledby="detailtab"></section><section id="inspectjson" role="tabpanel" aria-labelledby="jsontab" hidden><div class="jsonactions"><button id="copyjson">Copy JSON</button><span id="copystatus" role="status"></span></div><pre id="eventjson" tabindex="0"></pre></section></div></aside></div></main></div></body></html>
